name: Foundation gates
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  foundation:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: plinth_admin
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: plinth
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U plinth_admin -d plinth"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://plinth_app:local-development-only@localhost:5432/plinth
      TEST_ADMIN_DATABASE_URL: postgresql://plinth_admin:local-development-only@localhost:5432/plinth
      PGPASSWORD: local-development-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: psql -h localhost -U plinth_admin -d plinth -v ON_ERROR_STOP=1 -f db/local-init.sql
      - run: psql -h localhost -U plinth_admin -d plinth -v ON_ERROR_STOP=1 -f db/migrations/001-tenancy.sql
      - run: psql -h localhost -U plinth_admin -d plinth -v ON_ERROR_STOP=1 -f db/migrations/002-access.sql
      - run: psql -h localhost -U plinth_admin -d plinth -v ON_ERROR_STOP=1 -f db/migrations/003-consent.sql
      - run: npm test
      - run: npm run test:tenant
      - run: npm run test:http
      - run: npm run test:architecture
      - run: npm run test:db:embedded
      - run: npm run test:db
