services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: plinth_admin
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: plinth
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - plinth_pg:/var/lib/postgresql/data
      - ./db/local-init.sql:/docker-entrypoint-initdb.d/00-role.sql:ro
      - ./db/migrations/001-tenancy.sql:/docker-entrypoint-initdb.d/01-tenancy.sql:ro
      - ./db/migrations/002-access.sql:/docker-entrypoint-initdb.d/02-access.sql:ro
      - ./db/migrations/003-consent.sql:/docker-entrypoint-initdb.d/03-consent.sql:ro
      - ./db/migrations/004-identity.sql:/docker-entrypoint-initdb.d/04-identity.sql:ro
      - ./db/migrations/005-hubs.sql:/docker-entrypoint-initdb.d/05-hubs.sql:ro
      - ./db/migrations/006-auth-sessions.sql:/docker-entrypoint-initdb.d/06-auth.sql:ro
      - ./db/migrations/007-auth-function-owner.sql:/docker-entrypoint-initdb.d/07-auth-owner.sql:ro
      - ./db/migrations/008-login-attempts.sql:/docker-entrypoint-initdb.d/08-login-attempts.sql:ro
      - ./db/migrations/009-organisation-admin.sql:/docker-entrypoint-initdb.d/09-organisation-admin.sql:ro
      - ./db/migrations/010-purpose-publication.sql:/docker-entrypoint-initdb.d/10-purpose-publication.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plinth_admin -d plinth"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:16379:6379"
volumes:
  plinth_pg:
